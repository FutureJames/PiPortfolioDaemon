<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Atari Portfolio</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="styles.css" type="text/css">
    <link href="favicon.ico" rel="icon" type="image/x-icon" />
</head>
<body>
    <div class="page">
        <header class="header-wrapper">
            <img id="logo" src="logo.png" alt="Atari Portfolio">
            <h1>File Transfer</h1>
        </header>

        <main class="content">
            <section class="card column1" aria-labelledby="files_title">
                <div class="card-header">
                    <h2 class="card-title" id="files_title">Portfolio files</h2>
                    <div class="drive-toggle" id="drive_toggle" role="radiogroup" aria-label="Drive" data-drive="c:\">
                        <span class="drive-thumb" aria-hidden="true"></span>
                        <button type="button" role="radio" data-drive="a:\" aria-checked="false" tabindex="-1" title="A:\ removable card">
                            <span class="drive-letter">A:\</span>
                            <span class="drive-name">Card</span>
                        </button>
                        <button type="button" role="radio" data-drive="c:\" aria-checked="true" tabindex="0" title="C:\ RAM disk">
                            <span class="drive-letter">C:\</span>
                            <span class="drive-name">RAM</span>
                        </button>
                    </div>
                </div>

                <div class="folder-row">
                    <label for="current_folder" class="path-field">
                        <span class="visually-hidden">Directory</span>
                        <span class="path-prefix" id="path_prefix" aria-hidden="true">C:\</span>
                        <input type="text" id="current_folder" name="current_folder"
                               placeholder="Directory (blank for root)"
                               spellcheck="false" autocomplete="off" autocapitalize="characters">
                    </label>
                    <button type="button" id="folder_open" class="button-secondary">Open</button>
                </div>

                <div id="dir_container">
                    <ul id="file_list"></ul>
                </div>

                <div id="upload_form">
                    <div id="drop_zone">
                        <form action="/upload" method="post" enctype="multipart/form-data">
                            <p class="drop-hint">Drop a file here to send it to the Portfolio</p>
                            <div class="upload-actions">
                                <label for="filesToUpload" class="button button-secondary">Choose file</label>
                                <input type="file" name="filesToUpload" id="filesToUpload" class="visually-hidden">
                                <input type="submit" value="Upload" id="file_submit" name="submit" disabled>
                            </div>
                            <div id="file_name" aria-live="polite"></div>
                        </form>
                    </div>
                </div>
            </section>

            <section class="card column2" aria-labelledby="log_title">
                <div class="card-header">
                    <h2 class="card-title" id="log_title">Activity</h2>
                    <button id="clear" name="clear" class="button-secondary" type="button" onclick="clearLog()">Clear</button>
                </div>
                <label for="log" class="visually-hidden">Activity log</label>
                <textarea id="log" name="log" readonly="readonly"></textarea>
            </section>
        </main>
    </div>
    <script src="rpf.js" type="application/javascript"></script>
</body>
</html>
